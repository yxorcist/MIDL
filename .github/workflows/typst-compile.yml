name: Typst compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
      - name: Compile every course through Makefile
        run: make compile DIST_ROOT=/tmp/midl-dist TIMESTAMP=ci
