name: Typst compile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5

      - name: First build
        run: |
          make | tee /tmp/midl-first-build.log
          test -d dist
          test "$(find dist -type f -name '*.pdf' | wc -l)" -gt 0

      - name: Verify no-op incremental build
        run: |
          make | tee /tmp/midl-second-build.log
          grep -q "compiled 0 artifact(s)" /tmp/midl-second-build.log
          grep -q "skipped .* unchanged" /tmp/midl-second-build.log

      - name: Verify single TD rebuild
        run: |
          printf '\n// incremental-ci-test\n' >> 01_methodes_discretes/TD/fiche01/exercices/ex01.typ
          make | tee /tmp/midl-td-build.log
          grep -q "\[typst\] 01_methodes_discretes/TD/fiche01/exercices/ex01.typ" /tmp/midl-td-build.log
          grep -q "compiled 1 artifact(s)" /tmp/midl-td-build.log
          git checkout -- 01_methodes_discretes/TD/fiche01/exercices/ex01.typ
          make >/dev/null

      - name: Verify dependency rebuild
        run: |
          printf '\n// dependency-ci-test\n' >> 05_fonctions_variable_reelle/CM/fragments/2026-09-16_03_exemples-intermediaires.typ
          make | tee /tmp/midl-dependency-build.log
          grep -q "\[typst\] 05_fonctions_variable_reelle/CM/chapitres/01_series-positives/chapitre.typ" /tmp/midl-dependency-build.log
          grep -q "\[typst\] 05_fonctions_variable_reelle/CM/cours.typ" /tmp/midl-dependency-build.log
          git checkout -- 05_fonctions_variable_reelle/CM/fragments/2026-09-16_03_exemples-intermediaires.typ

      - name: Verify clean
        run: |
          make clean
          test ! -e dist
          test ! -e .midl/build-state.json

      - name: Verify full rebuild after clean
        run: |
          make | tee /tmp/midl-rebuild.log
          test -d dist
          grep -vq "compiled 0 artifact(s)" /tmp/midl-rebuild.log

      - name: Verify inbox file and directory upload commands
        run: |
          mkdir -p /tmp/midl-bin /tmp/midl-inbox-test/photos
          cat > /tmp/midl-bin/rclone <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> /tmp/midl-rclone.log
          EOF
          chmod +x /tmp/midl-bin/rclone
          printf 'pdf' > "/tmp/midl-inbox-test/TD 1.pdf"
          printf 'image' > /tmp/midl-inbox-test/photos/page1.jpg
          PATH="/tmp/midl-bin:$PATH" python3 00_admin/midl.py inbox "/tmp/midl-inbox-test/TD 1.pdf"
          PATH="/tmp/midl-bin:$PATH" python3 00_admin/midl.py inbox /tmp/midl-inbox-test/photos
          grep -Fq "copyto /tmp/midl-inbox-test/TD 1.pdf gdrive:MIDL/INBOX/TD 1.pdf --progress" /tmp/midl-rclone.log
          grep -Fq "copy /tmp/midl-inbox-test/photos gdrive:MIDL/INBOX/photos --create-empty-src-dirs --progress" /tmp/midl-rclone.log

      - name: Verify inbox missing-path failure
        run: |
          mkdir -p /tmp/midl-bin
          cat > /tmp/midl-bin/rclone <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x /tmp/midl-bin/rclone
          if PATH="/tmp/midl-bin:$PATH" python3 00_admin/midl.py inbox /tmp/does-not-exist; then
            echo "missing path unexpectedly succeeded"
            exit 1
          fi
