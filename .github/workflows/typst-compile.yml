name: Typst compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
      - name: Compile every course
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Compiling $file"
            output="/tmp/$(echo "$file" | tr '/ ' '__').pdf"
            typst compile "$file" "$output"
          done < <(find . -type f -name 'cours.typ' | sort)
