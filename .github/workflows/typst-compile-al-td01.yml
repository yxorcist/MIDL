name: Verify AL Typst
on:
  push:
    branches:
      - 'validation/typst-*'
      - main
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
      - name: Compile TD01 exercises 1 through 7 and TD02 exercise 1
        run: |
          set -euo pipefail
          for f in 02_algebre_lineaire/TD/fiche01/exercices/ex0{1,2,3,4,5,6,7}.typ; do
            echo "Compiling $f"
            typst compile "$f" "/tmp/$(basename "$f" .typ).pdf"
          done
          echo "Compiling TD02 exercise 1"
          typst compile 02_algebre_lineaire/TD/fiche02/exercices/ex01.typ /tmp/al-td02-ex01.pdf
