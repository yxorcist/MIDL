    <style>.actor{fill:#f7f7f7;stroke:#222;stroke-width:2}.system{fill:#fff3a8;stroke:#222;stroke-width:2}.proc{fill:#fff;stroke:#555;stroke-width:1.6}.flow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.renew{fill:none;stroke:#555;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}.title{font-family:sans-serif;font-size:18px;font-weight:bold}.txt{font-family:sans-serif;font-size:14px}.num{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#555}</style>
